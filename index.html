<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARW SHOP</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1b1b1b;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 10px rgba(255,255,255,.1);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:10px;
margin:0;
}

.price{
padding:0 10px 10px;
color:#00ff88;
font-size:22px;
font-weight:bold;
}

.btn{
display:block;
margin:10px;
padding:12px;
background:#00ff88;
color:black;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
background:#000;
margin-top:20px;
}
</style>

</head>
<body>

<header>DARW SHOP</header>

<div class="products">

<div class="card">
<img src="https://picsum.photos/500/500?1">
<h3>Premium Məhsul</h3>
<div class="price">49 AZN</div>
<a class="btn" href="#">Sifariş et</a>
</div>

<div class="card">
<img src="https://picsum.photos/500/500?2">
<h3>Yeni Kolleksiya</h3>
<div class="price">69 AZN</div>
<a class="btn" href="#">Sifariş et</a>
</div>

<div class="card">
<img src="https://picsum.photos/500/500?3">
<h3>Top Məhsul</h3>
<div class="price">89 AZN</div>
<a class="btn" href="#">Sifariş et</a>
</
